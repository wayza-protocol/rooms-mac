[package]
name = "wayza-rooms"
version = "0.1.1"
edition = "2021"
description = "The Wayza app for Mac"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
anyhow = "1"
regex = "1" # Unicode classes for names in the "My computer too" dialog (ask.rs)
tauri-plugin-updater = "2"

# The system's own dialog on the Mac (ask.rs): the same versions Tauri already builds with.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[profile.release]
strip = true
lto = true
