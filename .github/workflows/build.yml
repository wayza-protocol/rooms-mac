# Builds the Mac app on a Mac runner. With the signing secrets set (Graham adds them once, like the Worker's secrets),
# the build is signed with his Developer ID and notarised; without them it is an unsigned build for trying out.
name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15  # macos-14 images retire on 2 Nov 2026 (actions/runner-images#13518)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci || npm install
      - name: Build (signed when the secrets are set)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          npx tauri build --target universal-apple-darwin --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: Wayza-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
