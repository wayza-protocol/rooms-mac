# Builds the Mac app on a Mac runner. With the signing secrets set (Graham adds them once, like the Worker's secrets),
# the build is signed with his Developer ID and notarised, disk image too; without them it is an unsigned build for
# trying out.
#
# A tag like v0.1.1 (the version in tauri.conf.json) also puts the build up as a pre-release on this repo: the disk
# image and the update (Wayza.app.tar.gz). The update key never leaves Graham's Mac, so its signature
# (Wayza.app.tar.gz.sig) is made there and added to the release after; until it is, wayza.com tells installed apps
# there is nothing new (wayza-server src/wayza/mac-download.js). A tag needs the signing secrets: a release is never
# unsigned.
name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only the tag's release step writes: it puts the release up

jobs:
  mac:
    runs-on: macos-15  # macos-14 images retire on 2 Nov 2026 (actions/runner-images#13518)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci || npm install
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build (signed when the secrets are set)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          npx tauri build --target universal-apple-darwin
      # Tauri notarises the app inside; the disk image people download is notarised and stapled here, so it opens
      # without a warning even offline.
      - name: Notarise the disk image
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "Unsigned build: nothing to notarise."; exit 0; fi
          for d in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$d" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$d"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Wayza-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Put the test release up
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          b=src-tauri/target/universal-apple-darwin/release/bundle
          v=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$TAG" = "v$v" ] || { echo "The tag $TAG isn't the version in tauri.conf.json ($v)."; exit 1; }
          xcrun stapler validate $b/dmg/*.dmg || { echo "A release needs the signing secrets."; exit 1; }
          # The update is the notarised app itself, as the updater expects it: Wayza.app in a .tar.gz.
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/Wayza.app.tar.gz" -C $b/macos Wayza.app
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Wayza $v (test)" --notes "Test version of the Wayza app for Mac." \
            $b/dmg/*.dmg "$RUNNER_TEMP/Wayza.app.tar.gz"
